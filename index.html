<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Görev Panosu</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="container py-5"><header class="d-flex justify-content-between align-items-center mb-4"><div><p class="eyebrow mb-1">KİŞİSEL ÇALIŞMA ALANI</p><h1>Görev panosu</h1><p class="text-secondary mb-0">Bugün neyi tamamlayacaksın?</p></div><span class="badge rounded-pill text-bg-light">LocalStorage ile kayıtlı</span></header><section class="card shadow-sm border-0 p-4 mb-4"><form id="task-form" class="row g-3"><input id="task-id" type="hidden"><div class="col-md-7"><label class="form-label" for="task-title">Yeni görev</label><input id="task-title" class="form-control" required maxlength="100" placeholder="Örn. Proje sunumunu hazırla"></div><div class="col-md-3"><label class="form-label" for="task-date">Son tarih</label><input id="task-date" type="date" class="form-control"></div><div class="col-md-2 d-grid align-items-end"><button class="btn btn-primary" type="submit" id="submit-button">Görev ekle</button></div></form></section><section class="card shadow-sm border-0 p-4"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Görevler <span id="task-count" class="badge rounded-pill text-bg-light">0</span></h2><select id="filter" class="form-select form-select-sm" style="width:170px"><option value="all">Tüm görevler</option><option value="active">Devam edenler</option><option value="done">Tamamlananlar</option></select></div><ul id="task-list" class="list-group list-group-flush"></ul><p id="empty-state" class="text-secondary text-center py-4 mb-0">Henüz görev yok. İlk görevini ekle.</p></section></div><script src="app.js"></script></body></html>
