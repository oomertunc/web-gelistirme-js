<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Görev Panosu</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#202b40;font-family:Inter,system-ui,sans-serif}.container{max-width:1040px;margin:auto;padding:56px 28px}h1{font-size:2.1rem;font-weight:750;margin:.15rem 0 .4rem}.eyebrow{font-size:.72rem;letter-spacing:.15em;color:#64748b;font-weight:700}.card{background:#fff;border-radius:18px;padding:24px;margin-bottom:24px;box-shadow:0 10px 30px #25355510}.text-secondary{color:#6b778b}.d-flex{display:flex;justify-content:space-between;align-items:center}.row{display:flex;gap:16px;align-items:end}.col-md-7{flex:7}.col-md-3{flex:3}.col-md-2{flex:2}.form-control,.form-select{width:100%;border:1px solid #d9dfeb;border-radius:10px;padding:12px;background:#fff;font:inherit}.form-label{display:block;margin-bottom:7px;font-weight:600}.btn{padding:12px 16px;border:0;border-radius:10px;background:#5b61e8;color:#fff;font-weight:700;cursor:pointer}.badge{padding:6px 11px;background:#eef1f7;border-radius:99px;color:#526078}.list-group{padding:0;list-style:none}.task-row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid #edf0f5}.task-title{flex:1}.task-title.done{text-decoration:line-through;color:#8a94a6}.task-date{font-size:.8rem;color:#7b8494}.task-actions{display:flex;gap:8px}.task-actions button{border:0;background:none;color:#667085;font:inherit;cursor:pointer}.form-check-input{accent-color:#5b61e8}@media(max-width:700px){.container{padding:28px 16px}.row{display:block}.row>div{margin-bottom:12px}.task-date{display:none}}</style></head><body><main class="container"><header class="d-flex"><div><p class="eyebrow">KİŞİSEL ÇALIŞMA ALANI</p><h1>Görev panosu</h1><p class="text-secondary">Bugün neyi tamamlayacaksın?</p></div><span class="badge">LocalStorage ile kayıtlı</span></header><section class="card"><form id="task-form" class="row"><input id="task-id" type="hidden"><div class="col-md-7"><label class="form-label" for="task-title">Yeni görev</label><input id="task-title" class="form-control" required maxlength="100" placeholder="Örn. Proje sunumunu hazırla"></div><div class="col-md-3"><label class="form-label" for="task-date">Son tarih</label><input id="task-date" type="date" class="form-control"></div><div class="col-md-2"><button class="btn" type="submit" id="submit-button">Görev ekle</button></div></form></section><section class="card"><div class="d-flex"><h2>Görevler <span id="task-count" class="badge">0</span></h2><select id="filter" class="form-select" style="width:170px"><option value="all">Tüm görevler</option><option value="active">Devam edenler</option><option value="done">Tamamlananlar</option></select></div><ul id="task-list" class="list-group"></ul><p id="empty-state" class="text-secondary">Henüz görev yok. İlk görevini ekle.</p></section></main><script>const KEY='gorev-panosu-v1';let tasks=JSON.parse(localStorage.getItem(KEY)||'[]');const form=document.querySelector('#task-form'),titleInput=document.querySelector('#task-title'),dateInput=document.querySelector('#task-date');function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}function render(){const list=document.querySelector('#task-list'),filter=document.querySelector('#filter').value;list.replaceChildren();const visible=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));document.querySelector('#task-count').textContent=tasks.length;document.querySelector('#empty-state').hidden=visible.length>0;for(const task of visible){const li=document.createElement('li');li.className='task-row';const check=document.createElement('input');check.type='checkbox';check.className='form-check-input';check.checked=task.done;check.onchange=()=>{task.done=check.checked;save()};const name=document.createElement('span');name.className='task-title'+(task.done?' done':'');name.textContent=task.title;const date=document.createElement('span');date.className='task-date';date.textContent=task.date||'';const actions=document.createElement('span');actions.className='task-actions';const edit=document.createElement('button');edit.textContent='Düzenle';edit.onclick=()=>{document.querySelector('#task-id').value=task.id;titleInput.value=task.title;dateInput.value=task.date;document.querySelector('#submit-button').textContent='Kaydet';titleInput.focus()};const del=document.createElement('button');del.textContent='Sil';del.onclick=()=>{tasks=tasks.filter(x=>x.id!==task.id);save()};actions.append(edit,del);li.append(check,name,date,actions);list.append(li)}}form.onsubmit=e=>{e.preventDefault();const id=document.querySelector('#task-id').value,title=titleInput.value.trim();if(!title)return;if(id){const t=tasks.find(x=>x.id===id);t.title=title;t.date=dateInput.value}else tasks.unshift({id:crypto.randomUUID(),title,date:dateInput.value,done:false});form.reset();document.querySelector('#task-id').value='';document.querySelector('#submit-button').textContent='Görev ekle';save()};document.querySelector('#filter').onchange=render;render();</script></body></html>
